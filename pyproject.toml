[project]
name = "vampire-coffin"
version = "0.1.0"
description = "Nosferatu's Coffin: slide the lid and the vampire sits up (Printables Halloween 2026: Make It Move)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "build123d>=0.13.0",
    "numpy>=2",
    "pillow>=13.0.0",
    "trimesh>=5.2.0",
]

[project.scripts]
vampire-coffin = "vampire_coffin:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "networkx>=3.7",
    "pytest>=9.1.1",
    "rtree>=1.4.1",
    "shapely>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
